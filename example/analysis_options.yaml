# The package's own strict config, one level up: an example is code the reader
# copies, so it answers to the same rules as `lib/`. Its `analyzer: exclude:`
# list comes down with the include: those globs are matched against whatever
# package is being analysed, so `macos/**` there already covers this example's
# own `macos/`, and a second copy here would say nothing the first does not.
include: ../analysis_options.yaml

linter:
  rules:
    # Off for an example, the same three any example switches off: an example
    # app exports no API to document, its one-line widget methods read better
    # as blocks, and a fire-and-forget call is the demo itself rather than a
    # forgotten `await`.
    public_member_api_docs: false
    prefer_expression_function_bodies: false
    discarded_futures: false
    # A fourth, particular to this example: every lesson is prose, and each
    # paragraph is one string wrapped across lines inside `explanation: const
    # [...]`. The rule cannot tell that from a forgotten comma, and here it is
    # always the former.
    no_adjacent_strings_in_list: false
